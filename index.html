<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>카드 로그라이크 RPG</title><style>
:root{color-scheme:dark;--bg:#101421;--panel:#1b2233;--soft:#283249;--line:#40506d;--gold:#ffcf70;--good:#73d6a6;--red:#ff7f89}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#263251,#101421 70%);font-family:system-ui,'Malgun Gothic',sans-serif;color:#eef2ff}main{max-width:1000px;margin:auto;padding:20px}h1{margin:0 0 8px;color:var(--gold)}h2{margin:8px 0 14px}.sub{color:#b5c0db;margin:0 0 22px}button{background:#384967;color:white;border:1px solid #67799a;border-radius:12px;padding:12px;cursor:pointer;font:inherit}button:hover:not(:disabled){background:#536a93}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#b17b34;border-color:#e6bd68;color:#fff}.panel{background:var(--panel);border:1px solid #3b4b68;border-radius:18px;padding:18px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.class{min-height:210px;text-align:left}.class .emoji{font-size:38px;display:block}.class strong{display:block;font-size:22px;margin:10px 0}.muted{color:#abb7d0;font-size:14px}.hidden{display:none!important}.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:var(--soft);padding:8px 12px;border-radius:12px;border:1px solid #44536c}.arena{display:grid;grid-template-columns:1fr auto 1.5fr;align-items:center;gap:12px;min-height:210px}.portrait{text-align:center;padding:14px;background:#202b42;border-radius:16px}.face{font-size:53px}.enemies{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.enemy{min-width:110px;max-width:150px;flex:1;text-align:center;padding:12px;background:#382635;border:1px solid #745363;border-radius:14px}.enemy.dead{opacity:.32}.enemy .face{font-size:34px}.meter{height:9px;border-radius:10px;background:#512a38;overflow:hidden;margin-top:8px}.meter>div{height:100%;background:#ef6579;transition:width .2s}.player .meter>div{background:#6cd8a0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.card{min-height:150px;background:linear-gradient(150deg,#39425e,#1e2b42);border:2px solid #8b93a8;display:flex;flex-direction:column;align-items:stretch;gap:8px;text-align:left}.card strong{color:#ffdc93;font-size:17px}.card small{color:#c3cee3}.card .rank{margin-top:auto;font-size:12px;color:#a9d4fb}.log{max-height:160px;overflow:auto;background:#101929;padding:12px;border-radius:10px;font-size:14px;line-height:1.7}.log div{border-bottom:1px solid #263349;padding:4px}.reward{min-height:130px}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}.alert{color:#ffdd8f}.equip{color:#a9d4fb}.help{font-size:13px;color:#b2bdd3} @media(max-width:650px){main{padding:12px}.arena{grid-template-columns:1fr;gap:8px}.arena .vs{display:none}.portrait{padding:8px}.face{font-size:38px}.card{min-height:135px}}
</style></head><body><main><h1>⚔️ 카드 로그라이크 RPG</h1><p class="sub">직업 선택 · 1장씩 번갈아 쓰는 카드 전투 · 장비 · 7등급 카드</p>
<section id="select" class="panel"><h2>직업을 선택해</h2><div class="grid" id="classes"></div><p class="help">게임은 이 HTML 파일 하나로 실행돼. 추가 설치나 인터넷 연결이 필요하지 않아.</p></section>
<section id="game" class="hidden"><div class="panel"><div class="top"><h2 id="stage">1구역</h2><div class="stats"><span class="pill" id="turn"></span><span class="pill" id="equip"></span><span class="pill" id="score"></span></div></div><div class="arena"><div id="player" class="portrait player"></div><div class="vs">⚔️</div><div id="enemies" class="enemies"></div></div></div><div class="panel" id="combat"><div class="top"><h2>내 카드</h2><div id="status" class="alert"></div></div><div id="cards" class="cards"></div><p class="help">카드를 한 번 사용하면 살아 있는 적들이 각자 행동해. 적은 구역에 따라 최대 4마리까지 등장해.</p></div><div class="panel hidden" id="rewards"><h2>🎁 승리 보상 — 하나 선택</h2><div class="grid" id="rewardCards"></div></div><div class="panel"><h2>전투 기록</h2><div id="log" class="log"></div><div class="controls" style="margin-top:12px"><button id="restart">처음부터 다시 하기</button><button id="back">직업 다시 선택</button></div></div></section></main>
<script>
(()=>{'use strict';const ranks=['매우낡은','낡은','조금 낡은','평범한','약간 훌륭한','훌륭함','매우훌륭함'];const defs={archer:{name:'궁수',emoji:'🏹',hp:110,gear:'활',cards:[['활쏘기','고정 피해 25', 'shot'],['활 연사','5 피해 화살을 1~10발', 'rapid']]},fighter:{name:'투사',emoji:'🥋',hp:135,gear:'건틀릿',cards:[['주먹 펀치','피해 25~30','punch'],['킥','한 턴 충전 · 피해 50~70 · 최대 2명','kick']]},tank:{name:'탱커',emoji:'🛡️',hp:175,gear:'방패',cards:[['방패 치기','피해 20 · 기절 확률 10%','bash'],['돌진','모든 적에게 30 피해 · 적당 반동 20','charge']]}};let state=null;const $=id=>document.getElementById(id),rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function log(s){$('log').insertAdjacentHTML('afterbegin','<div>'+esc(s)+'</div>')};function start(kind){let d=defs[kind];state={kind,stage:1,hp:d.hp,max:d.hp,armor:0,weapon:0,rank:0,points:0,cards:d.cards.map((c,i)=>({name:c[0],desc:c[1],id:c[2],rank:0,index:i})),enemies:[],charge:0,done:false,phase:'fight',turn:1};$('select').classList.add('hidden');$('game').classList.remove('hidden');$('log').innerHTML='';log(d.name+'의 모험 시작!');spawn()};function spawn(){let s=state;let n=Math.min(4,1+Math.floor((s.stage-1)/2));s.enemies=Array.from({length:n},(_,i)=>{let max=rand(45,68)+s.stage*10;return{id:i,name:['슬라임','도적','해골','늑대'][rand(0,3)],hp:max,max,atk:rand(9,14)+Math.floor(s.stage*1.7),stun:0}});s.phase='fight';s.turn=1;s.charge=0;log('── '+s.stage+'구역: 적 '+n+'마리 등장 ──');draw()};const alive=()=>state.enemies.filter(e=>e.hp>0);function damageEnemy(e,n){n=Math.max(0,Math.floor(n));e.hp=Math.max(0,e.hp-n);log(e.name+'에게 '+n+' 피해!'+(e.hp===0?' 처치!':''))};function hurt(n,reason){let s=state;let dealt=Math.max(0,Math.ceil(n*(s.kind==='tank'?.9:1))-s.armor);s.hp=Math.max(0,s.hp-dealt);log(reason+': '+dealt+' 피해 (HP '+s.hp+'/'+s.max+')')};function chooseTarget(){let targets=alive();return targets.length===1?targets[0]:null};function play(id){let s=state;if(!s||s.phase!=='fight'||s.hp<=0||s.charge)return;let c=s.cards.find(x=>x.id===id);if(!c)return;let enemy=chooseTarget();if(!enemy){s.pending=id;draw();return}doCard(id,enemy.id)}function doCard(id,targetId){let s=state;if(s.phase!=='fight')return;let target=s.enemies.find(e=>e.id===targetId&&e.hp>0)||alive()[0];if(!target)return;s.pending=null;let card=s.cards.find(c=>c.id===id),boost=card?card.rank*5:0,weapon=s.weapon;if(id==='shot')damageEnemy(target,25+boost+weapon);if(id==='rapid'){let shots=rand(1,10);log('활 연사: '+shots+'발!');for(let i=0;i<shots&&alive().length;i++)damageEnemy(alive().find(e=>e.id===target.id)||alive()[0],5+boost+weapon)}if(id==='punch')damageEnemy(target,rand(25,30)+boost+weapon);if(id==='kick'){s.charge=1;log('킥 충전 시작! 다음 적 차례에 받는 피해 20% 감소.');enemyTurn(true);if(s.hp<=0){lose();return}log('킥 발동!');let targets=[target,...alive().filter(e=>e.id!==target.id)].slice(0,2);targets.forEach(e=>{if(e.hp>0)damageEnemy(e,rand(50,70)+boost+weapon)});s.charge=0;finishTurn();return}if(id==='bash'){damageEnemy(target,20+boost+weapon);if(target.hp>0&&Math.random()<.1){target.stun=rand(1,3);log(target.name+' 기절! '+target.stun+'턴 행동 불가')}}if(id==='charge'){let targets=alive().slice();targets.forEach(e=>damageEnemy(e,30+boost+weapon));hurt(targets.length*20,'돌진 반동')}finishTurn()};function enemyTurn(kickGuard=false){let s=state;for(const e of alive()){if(s.hp<=0)break;if(e.stun>0){log(e.name+'은 기절 상태로 행동 불가 ('+e.stun+'턴 남음)');e.stun--;continue}let raw=e.atk;if(kickGuard)raw=Math.ceil(raw*.8);hurt(raw,e.name+'의 공격')}}function finishTurn(){let s=state;if(s.hp<=0)return lose();if(alive().length===0)return win();enemyTurn();if(s.hp<=0)return lose();s.turn++;draw()};function win(){let s=state;s.phase='reward';s.points+=s.stage*10;log('구역 클리어! 보상을 선택해.');draw()};function lose(){state.phase='dead';log('💀 모험 종료 · '+state.stage+'구역 · 점수 '+state.points);draw()};function rewards(){let s=state;let card=s.cards[rand(0,s.cards.length-1)],upRank=Math.min(6,card.rank+1),gearRank=Math.min(6,s.rank+1);return[{title:'❤️ 휴식',description:'HP '+Math.min(s.max-s.hp,35)+' 회복',act:()=>{s.hp=Math.min(s.max,s.hp+35)}},{title:'🃏 '+card.name+' 강화',description:'카드 등급 '+ranks[card.rank]+' → '+ranks[upRank]+' (공격 피해 상승)',act:()=>{card.rank=upRank}},{title:'🧰 '+defs[s.kind].gear+' 획득',description:'장비 등급 '+ranks[s.rank]+' → '+ranks[gearRank]+' · '+(s.kind==='tank'?'방어력':'공격력')+' 증가',act:()=>{s.rank=gearRank;if(s.kind==='tank')s.armor+=2;else s.weapon+=3}}]};function draw(){let s=state,d=defs[s.kind];$('stage').textContent=s.stage+'구역';$('turn').textContent='턴 '+s.turn;$('equip').textContent=d.gear+' '+ranks[s.rank]+' / '+(s.kind==='tank'?'방어 '+s.armor:'공격 +'+s.weapon);$('score').textContent='점수 '+s.points;$('player').innerHTML='<div class="face">'+d.emoji+'</div><b>'+d.name+'</b><div>HP '+s.hp+' / '+s.max+'</div><div class="meter"><div style="width:'+(100*s.hp/s.max)+'%"></div></div>'+(s.kind==='tank'?'<small>피해 10% 감소</small>':'');$('enemies').innerHTML=s.enemies.map(e=>'<div class="enemy '+(e.hp===0?'dead':'')+'"><div class="face">'+(e.name==='슬라임'?'🟢':e.name==='도적'?'🥷':e.name==='해골'?'💀':'🐺')+'</div><b>'+esc(e.name)+'</b><div>HP '+e.hp+'/'+e.max+'</div><div class="meter"><div style="width:'+(e.hp/e.max*100)+'%"></div></div><small>'+(e.stun?'💫 기절 '+e.stun+'턴':'공격 '+e.atk)+'</small></div>').join('');$('combat').classList.toggle('hidden',s.phase!=='fight');$('rewards').classList.toggle('hidden',s.phase!=='reward');$('status').textContent=s.phase==='dead'?'패배':s.pending?'공격할 적을 선택해':'';if(s.phase==='fight'){$('cards').innerHTML=s.pending?'<div class="panel" style="grid-column:1/-1"><h3>🎯 공격 대상 선택</h3><div class="grid">'+alive().map(e=>'<button data-target="'+e.id+'">'+esc(e.name)+' (HP '+e.hp+')</button>').join('')+'</div><button id="cancel">취소</button></div>':s.cards.map(c=>'<button class="card" data-card="'+esc(c.id)+'"><strong>'+esc(c.name)+'</strong><small>'+esc(c.desc)+'</small><span class="rank">'+ranks[c.rank]+'</span></button>').join('');$('cards').querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>play(b.dataset.card));$('cards').querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>doCard(s.pending,Number(b.dataset.target)));let cancel=$('cancel');if(cancel)cancel.onclick=()=>{s.pending=null;draw()}}if(s.phase==='reward'){$('rewardCards').innerHTML='';rewards().forEach(r=>{let b=document.createElement('button');b.className='reward';b.innerHTML='<b>'+esc(r.title)+'</b><p>'+esc(r.description)+'</p>';b.onclick=()=>{r.act();s.stage++;spawn()};$('rewardCards').append(b)})}if(s.phase==='dead')$('stage').textContent='💀 게임 오버 · '+s.stage+'구역'}Object.entries(defs).forEach(([k,d])=>{let b=document.createElement('button');b.className='class';b.innerHTML='<span class="emoji">'+d.emoji+'</span><strong>'+d.name+'</strong><div>HP '+d.hp+' · 전용 장비 '+d.gear+'</div><p class="muted">'+d.cards.map(x=>x[0]).join(' / ')+'</p><span class="muted">선택해서 모험 시작 →</span>';b.onclick=()=>start(k);$('classes').append(b)});$('restart').onclick=()=>start(state.kind);$('back').onclick=()=>{state=null;$('game').classList.add('hidden');$('select').classList.remove('hidden')};})();
</script></body></html>
