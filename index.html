<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>카드 로그라이크 RPG</title><style>
:root{color-scheme:dark;--bg:#101421;--panel:#1b2233;--soft:#283249;--line:#40506d;--gold:#ffcf70;--good:#73d6a6;--red:#ff7f89}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#263251,#101421 70%);font-family:system-ui,'Malgun Gothic',sans-serif;color:#eef2ff}main{max-width:1000px;margin:auto;padding:20px}h1{margin:0 0 8px;color:var(--gold)}h2{margin:8px 0 14px}.sub{color:#b5c0db;margin:0 0 22px}button{background:#384967;color:white;border:1px solid #67799a;border-radius:12px;padding:12px;cursor:pointer;font:inherit}button:hover:not(:disabled){background:#536a93}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#b17b34;border-color:#e6bd68;color:#fff}.panel{background:var(--panel);border:1px solid #3b4b68;border-radius:18px;padding:18px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.class{min-height:210px;text-align:left}.class .emoji{font-size:38px;display:block}.class strong{display:block;font-size:22px;margin:10px 0}.muted{color:#abb7d0;font-size:14px}.hidden{display:none!important}.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:var(--soft);padding:8px 12px;border-radius:12px;border:1px solid #44536c}.arena{display:grid;grid-template-columns:1fr auto 1.5fr;align-items:center;gap:12px;min-height:210px}.portrait{text-align:center;padding:14px;background:#202b42;border-radius:16px}.face{font-size:53px}.enemies{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.enemy{min-width:110px;max-width:150px;flex:1;text-align:center;padding:12px;background:#382635;border:1px solid #745363;border-radius:14px}.enemy.dead{opacity:.32}.enemy .face{font-size:34px}.meter{height:9px;border-radius:10px;background:#512a38;overflow:hidden;margin-top:8px}.meter>div{height:100%;background:#ef6579;transition:width .2s}.player .meter>div{background:#6cd8a0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.card{min-height:150px;background:linear-gradient(150deg,#39425e,#1e2b42);border:2px solid #8b93a8;display:flex;flex-direction:column;align-items:stretch;gap:8px;text-align:left}.card strong{color:#ffdc93;font-size:17px}.card small{color:#c3cee3}.card .rank{margin-top:auto;font-size:12px;color:#a9d4fb}.log{max-height:160px;overflow:auto;background:#101929;padding:12px;border-radius:10px;font-size:14px;line-height:1.7}.log div{border-bottom:1px solid #263349;padding:4px}.reward{min-height:130px}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}.alert{color:#ffdd8f}.equip{color:#a9d4fb}.help{font-size:13px;color:#b2bdd3} .timing{position:fixed;inset:0;background:#080b14e9;z-index:9;display:grid;place-items:center;padding:20px}.timerbox{background:#27334c;padding:25px;border-radius:16px;width:min(550px,95vw)}.track{height:40px;background:#42506c;position:relative;border-radius:9px;overflow:hidden}.zone{height:100%;position:absolute;background:white}.needle{height:100%;width:5px;background:red;position:absolute}.shopitem{min-height:125px;text-align:left}.knightpic{width:115px;height:120px;object-fit:contain} @media(max-width:650px){main{padding:12px}.arena{grid-template-columns:1fr;gap:8px}.arena .vs{display:none}.portrait{padding:8px}.face{font-size:38px}.card{min-height:135px}}
</style></head><body><main><h1>⚔️ 카드 로그라이크 RPG</h1><p class="sub">직업 선택 · 1장씩 번갈아 쓰는 카드 전투 · 장비 · 7등급 카드</p>
<section id="select" class="panel"><h2>직업을 선택해</h2><div class="grid" id="classes"></div><p class="help">게임은 이 HTML 파일 하나로 실행돼. 추가 설치나 인터넷 연결이 필요하지 않아.</p></section>
<div id="timing" class="timing hidden"><div class="timerbox"><h2 id="ttitle"></h2><p id="tdesc"></p><div class="track"><div id="tzone" class="zone"></div><div id="tneedle" class="needle"></div></div><p>흰색 구역에 빨간 화살표가 왔을 때 멈춰!</p><button id="tstop" class="primary">멈추기</button></div></div><section id="game" class="hidden"><div class="panel"><div class="top"><h2 id="stage">1구역</h2><div class="stats"><span class="pill" id="turn"></span><span class="pill" id="equip"></span><span class="pill" id="score"></span><span class="pill" id="coins"></span></div></div><div class="arena"><div id="player" class="portrait player"></div><div class="vs">⚔️</div><div id="enemies" class="enemies"></div></div></div><div class="panel" id="combat"><div class="top"><h2>내 카드</h2><div id="status" class="alert"></div></div><div id="cards" class="cards"></div><p class="help">카드를 한 번 사용하면 살아 있는 적들이 각자 행동해. 적은 구역에 따라 최대 4마리까지 등장해.</p></div><div class="panel hidden" id="shop"><h2>🛒 상점</h2><p id="shopText"></p><div id="shopList" class="grid"></div><button id="leaveShop" class="primary">다음 전투 →</button></div><div class="panel hidden" id="rewards"><h2>🎁 승리 보상 — 하나 선택</h2><div class="grid" id="rewardCards"></div></div><div class="panel"><h2>전투 기록</h2><div id="log" class="log"></div><div class="controls" style="margin-top:12px"><button id="restart">처음부터 다시 하기</button><button id="back">직업 다시 선택</button></div></div></section></main>
<script>
(()=>{'use strict';const ranks=['매우낡은','낡은','조금 낡은','평범한','약간 훌륭한','훌륭함','매우훌륭함'];const defs={knight:{name:'기사',emoji:'⚔️',hp:150,gear:'검',cards:[['베기','타이밍 성공마다 피해 +10 (최대 100)','slash'],['패링','성공하면 다음 공격 피해 -10 · 반사 5','parry']]},archer:{name:'궁수',emoji:'🏹',hp:110,gear:'활',cards:[['활쏘기','고정 피해 25', 'shot'],['활 연사','5 피해 화살을 1~10발', 'rapid']]},fighter:{name:'투사',emoji:'🥋',hp:135,gear:'건틀릿',cards:[['주먹 펀치','피해 25~30','punch'],['킥','한 턴 충전 · 피해 50~70 · 최대 2명','kick']]},tank:{name:'탱커',emoji:'🛡️',hp:175,gear:'방패',cards:[['방패 치기','피해 20 · 기절 확률 10%','bash'],['돌진','모든 적에게 30 피해 · 적당 반동 20','charge']]}};let state=null,timingMode='',timingTarget=null,tm=0,shopItems=[];const $=id=>document.getElementById(id),rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function log(s){$('log').insertAdjacentHTML('afterbegin','<div>'+esc(s)+'</div>')};function start(kind){let d=defs[kind];state={kind,stage:1,hp:d.hp,max:d.hp,armor:0,weapon:0,rank:0,points:0,coins:0,guard:0,slash:10,cards:d.cards.map((c,i)=>({name:c[0],desc:c[1],id:c[2],rank:0,index:i})),enemies:[],charge:0,done:false,phase:'fight',turn:1};$('select').classList.add('hidden');$('game').classList.remove('hidden');$('log').innerHTML='';log(d.name+'의 모험 시작!');spawn()};function spawn(){let s=state;let n=Math.min(4,1+Math.floor((s.stage-1)/2));s.enemies=Array.from({length:n},(_,i)=>{let max=rand(45,68)+s.stage*10;let tier=Math.min(5,Math.floor((s.stage-1)/4));return{tier,id:i,name:['슬라임','도적','해골','늑대'][rand(0,3)],hp:max,max,atk:rand(9,14)+Math.floor(s.stage*1.7),stun:0}});s.phase='fight';s.turn=1;s.charge=0;log('── '+s.stage+'구역: 적 '+n+'마리 등장 ──');draw()};const alive=()=>state.enemies.filter(e=>e.hp>0);function damageEnemy(e,n){n=Math.max(0,Math.floor(n));e.hp=Math.max(0,e.hp-n);log(e.name+'에게 '+n+' 피해!'+(e.hp===0?' 처치!':''))};function hurt(n,reason){let s=state;if(s.guard){let saved=Math.min(n,s.guard);n-=saved;s.guard=0;log('패링 방어 '+saved+' · 반사 '+Math.floor(saved/2));if(alive().length)damageEnemy(alive()[0],Math.floor(saved/2));if(alive().length&&Math.random()<.1){alive()[0].stun=rand(1,3);log('패링 기절 성공')}}let dealt=Math.max(0,Math.ceil(n*(s.kind==='tank'?.9:1))-s.armor);s.hp=Math.max(0,s.hp-dealt);log(reason+': '+dealt+' 피해 (HP '+s.hp+'/'+s.max+')')};function chooseTarget(){let targets=alive();return targets.length===1?targets[0]:null};function play(id){let s=state;if(!s||s.phase!=='fight'||s.hp<=0||s.charge)return;let c=s.cards.find(x=>x.id===id);if(!c)return;if(id==='parry'){startTimer('parry');return}let enemy=chooseTarget();if(!enemy){s.pending=id;draw();return}doCard(id,enemy.id)}function doCard(id,targetId){let s=state;if(s.phase!=='fight')return;let target=s.enemies.find(e=>e.id===targetId&&e.hp>0)||alive()[0];if(!target)return;s.pending=null;if(id==='slash'){startTimer('slash',target.id);return}let card=s.cards.find(c=>c.id===id),boost=card?card.rank*5:0,weapon=s.weapon;if(id==='shot')damageEnemy(target,25+boost+weapon);if(id==='rapid'){let shots=rand(1,10);log('활 연사: '+shots+'발!');for(let i=0;i<shots&&alive().length;i++)damageEnemy(alive().find(e=>e.id===target.id)||alive()[0],5+boost+weapon)}if(id==='punch')damageEnemy(target,rand(25,30)+boost+weapon);if(id==='kick'){s.charge=1;log('킥 충전 시작! 다음 적 차례에 받는 피해 20% 감소.');enemyTurn(true);if(s.hp<=0){lose();return}log('킥 발동!');let targets=[target,...alive().filter(e=>e.id!==target.id)].slice(0,2);targets.forEach(e=>{if(e.hp>0)damageEnemy(e,rand(50,70)+boost+weapon)});s.charge=0;finishTurn();return}if(id==='bash'){damageEnemy(target,20+boost+weapon);if(target.hp>0&&Math.random()<.1){target.stun=rand(1,3);log(target.name+' 기절! '+target.stun+'턴 행동 불가')}}if(id==='charge'){let targets=alive().slice();targets.forEach(e=>damageEnemy(e,30+boost+weapon));hurt(targets.length*20,'돌진 반동')}finishTurn()};function enemyTurn(kickGuard=false){let s=state;for(const e of alive()){if(s.hp<=0)break;if(e.stun>0){log(e.name+'은 기절 상태로 행동 불가 ('+e.stun+'턴 남음)');e.stun--;continue}let raw=e.atk;if(kickGuard)raw=Math.ceil(raw*.8);hurt(raw,e.name+'의 공격')}}function finishTurn(){let s=state;if(s.hp<=0)return lose();if(alive().length===0)return win();enemyTurn();if(s.hp<=0)return lose();s.turn++;draw()};function win(){let s=state;s.coins+=s.enemies.reduce((a,e)=>a+[5,10,15,20,25,50][e.tier],0);log('코인 획득! 현재 '+s.coins);s.phase='reward';s.points+=s.stage*10;log('구역 클리어! 보상을 선택해.');draw()};function lose(){state.phase='dead';log('💀 모험 종료 · '+state.stage+'구역 · 점수 '+state.points);draw()};function rewards(){let s=state;let card=s.cards[rand(0,s.cards.length-1)],upRank=Math.min(6,card.rank+1),gearRank=Math.min(6,s.rank+1);return[{title:'❤️ 휴식',description:'HP '+Math.min(s.max-s.hp,35)+' 회복',act:()=>{s.hp=Math.min(s.max,s.hp+35)}},{title:'🃏 '+card.name+' 강화',description:'카드 등급 '+ranks[card.rank]+' → '+ranks[upRank]+' (공격 피해 상승)',act:()=>{card.rank=upRank}},{title:'🧰 '+defs[s.kind].gear+' 획득',description:'장비 등급 '+ranks[s.rank]+' → '+ranks[gearRank]+' · '+(s.kind==='tank'?'방어력':'공격력')+' 증가',act:()=>{s.rank=gearRank;if(s.kind==='tank')s.armor+=2;else s.weapon+=3}}]};function startTimer(mode,id){timingMode=mode;timingTarget=id;let start=rand(8,72),width=rand(14,21);$('timing').dataset.start=start;$('timing').dataset.width=width;$('tzone').style.left=start+'%';$('tzone').style.width=width+'%';$('ttitle').textContent=mode==='slash'?'⚔️ 베기':'🛡️ 패링';$('tdesc').textContent=mode==='slash'?'성공마다 베기 피해 10 증가. 실패 시 현재 피해로 공격':'성공하면 다음 적 공격을 방어하고 절반 반사';$('timing').classList.remove('hidden');cancelAnimationFrame(tm);const begin=performance.now();function loop(t){let n=((t-begin)/370)%2,p=n<=1?n*100:(2-n)*100;$('tneedle').style.left=p+'%';$('timing').dataset.pos=p;tm=requestAnimationFrame(loop)}tm=requestAnimationFrame(loop)}
$('tstop').onclick=()=>{cancelAnimationFrame(tm);$('timing').classList.add('hidden');let s=state,pos=Number($('timing').dataset.pos),z=Number($('timing').dataset.start),w=Number($('timing').dataset.width),ok=pos>=z&&pos<=z+w;if(timingMode==='parry'){if(ok){s.guard=10;log('패링 성공!')}else log('패링 실패!');finishTurn()}else{if(ok){s.slash=Math.min(100,s.slash+10);log('베기 성공! '+s.slash);if(s.slash<100){startTimer('slash',timingTarget);return}}let target=s.enemies.find(e=>e.id===timingTarget&&e.hp>0)||alive()[0];if(target)damageEnemy(target,s.slash+s.weapon+(s.cards.find(c=>c.id==='slash')?.rank||0)*5);s.slash=10;finishTurn()}};
function openShop(){state.phase='shop';const s=state;shopItems=Array.from({length:6},(_,i)=>{let rank=rand(0,Math.min(6,2+Math.floor(s.stage/6))),type=i%3,c=s.cards[rand(0,s.cards.length-1)];return{rank,type,card:c,price:[8,15,25,40,65,110,180][rank]*Math.pow(2,Math.floor((s.stage-1)/20))*(type===1?2:1),sold:false}});draw()}
function drawShop(){let s=state;$('shopText').textContent='보유 코인: '+s.coins+' · 20웨이브마다 가격 2배 · 상점 간격 +1';$('shopList').innerHTML='';shopItems.forEach(o=>{let b=document.createElement('button');b.className='shopitem';b.disabled=o.sold||o.price>s.coins;const name=o.type===0?defs[s.kind].gear:o.type===1?'방어구':o.card.name;b.innerHTML='<b>'+['⚔️ 전용 장비','🛡️ 방어구','🃏 카드'][o.type]+' '+name+'</b><p>'+ranks[o.rank]+'</p><strong>🪙 '+o.price+'</strong><p>'+(o.sold?'구매 완료':o.price>s.coins?'코인 부족':'구매하기')+'</p>';b.onclick=()=>{if(o.sold||s.coins<o.price)return;s.coins-=o.price;o.sold=true;if(o.type===0){s.weapon+=2+o.rank*3;s.rank=Math.max(s.rank,o.rank)}else if(o.type===1)s.armor+=1+o.rank*2;else o.card.rank=Math.max(o.card.rank,o.rank);log(name+' 구매!');draw()};$('shopList').append(b)})}
